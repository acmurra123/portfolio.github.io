    <script>
      const btn = document.getElementById('menuBtn');
      const sidebar = document.getElementById('sidebar');

      if (btn && sidebar) {
        btn.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          btn.classList.toggle('is-open');
        });
      }

      // Seamless photography reel
      document.querySelectorAll('.photo-section').forEach(section => {
        const reel = section.querySelector('.photo-reel');
        const prev = section.querySelector('.photo-prev');
        const next = section.querySelector('.photo-next');
      
        const originals = Array.from(reel.querySelectorAll('img'));
        if (originals.length < 2) return;
      
        // Duplicate images on both sides of the original set.
        function cloneImage(img) {
          const clone = img.cloneNode(true);
          clone.alt = '';
          clone.setAttribute('aria-hidden', 'true');
          return clone;
        }
      
        originals.slice().reverse().forEach(img => {
          reel.prepend(cloneImage(img));
        });
      
        originals.forEach(img => {
          reel.appendChild(cloneImage(img));
        });
      
        let animationId = null;
        let isAnimating = false;
        const duration = 1500;
      
        function positions() {
          return Array.from(reel.querySelectorAll('img')).map(
            img => img.offsetLeft - reel.offsetLeft
          );
        }
      
        function cycleWidth() {
          const p = positions();
          return p[originals.length * 2] - p[originals.length];
        }
      
        function normalize() {
          if (isAnimating) return;
      
          const p = positions();
          const start = p[originals.length];
          const end = p[originals.length * 2];
          const width = cycleWidth();
      
          if (width <= 0) return;
      
          if (reel.scrollLeft >= end) {
            reel.scrollLeft -= width;
          } else if (reel.scrollLeft < start) {
            reel.scrollLeft += width;
          }
        }
      
        function initialize() {
          reel.scrollLeft = positions()[originals.length];
        }
      
        function moveReel(direction) {
          if (isAnimating) return;
      
          normalize();
      
          const p = positions();
          const current = reel.scrollLeft;
      
          const target = direction > 0
            ? p.find(x => x > current + 2)
            : [...p].reverse().find(x => x < current - 2);
      
          if (target === undefined) return;
      
          isAnimating = true;
      
          const distance = target - current;
          const startTime = performance.now();
      
          function animate(now) {
            const progress = Math.min((now - startTime) / duration, 1);
            const eased = 0.5 - Math.cos(Math.PI * progress) / 2;
      
            reel.scrollLeft = current + distance * eased;
      
            if (progress < 1) {
              animationId = requestAnimationFrame(animate);
            } else {
              animationId = null;
              isAnimating = false;
              normalize();
            }
          }
      
          animationId = requestAnimationFrame(animate);
        }
      
        prev.addEventListener('click', () => moveReel(-1));
        next.addEventListener('click', () => moveReel(1));
      
        // Keep manual scrolling within the repeating middle set.
        // requestAnimationFrame prevents excessive scroll processing.
        let scrollFrame = null;
      
        reel.addEventListener('scroll', () => {
          if (isAnimating || scrollFrame !== null) return;
      
          scrollFrame = requestAnimationFrame(() => {
            scrollFrame = null;
            normalize();
          });
        }, { passive: true });
      
        // Reposition after touch momentum finishes.
        reel.addEventListener('scrollend', normalize);
      
        // Wait until photos have dimensions before initializing.
        Promise.all(
          Array.from(reel.querySelectorAll('img')).map(img =>
            img.complete
              ? Promise.resolve()
              : new Promise(resolve => {
                  img.addEventListener('load', resolve, { once: true });
                  img.addEventListener('error', resolve, { once: true });
                })
          )
        ).then(initialize);
      
        window.addEventListener('resize', () => {
          if (!isAnimating) initialize();
        });
      });
    </script>
