    <script>
      const btn = document.getElementById('menuBtn');
      const sidebar = document.getElementById('sidebar');

      if (btn && sidebar) {
        btn.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          btn.classList.toggle('is-open');
        });
      }

      // Seamless photography reel
      document.querySelectorAll('.photo-section').forEach(section => {
        const reel = section.querySelector('.photo-reel');
        const prev = section.querySelector('.photo-prev');
        const next = section.querySelector('.photo-next');
      
        const originals = Array.from(reel.querySelectorAll('img'));
        if (originals.length < 2) return;
      
        // Duplicate the photos before and after the originals
        // so scrolling can continue in either direction.
        const before = originals.map(img => img.cloneNode(true));
        const after = originals.map(img => img.cloneNode(true));
      
        before.forEach(img => {
          img.setAttribute('aria-hidden', 'true');
          img.alt = '';
          reel.insertBefore(img, reel.firstChild);
        });
      
        after.forEach(img => {
          img.setAttribute('aria-hidden', 'true');
          img.alt = '';
          reel.appendChild(img);
        });
      
        let animationId = null;
        let isAnimating = false;
      
        const duration = 1200;
      
        function getPositions() {
          return Array.from(reel.querySelectorAll('img')).map(img =>
            img.offsetLeft - reel.offsetLeft
          );
        }
      
        function getCycleWidth() {
          const positions = getPositions();
          return positions[originals.length * 2] -
                 positions[originals.length];
        }
      
        function initialize() {
          const positions = getPositions();
          reel.scrollLeft = positions[originals.length];
        }
      
        function moveReel(direction) {
          if (isAnimating) return;
      
          const positions = getPositions();
          const current = reel.scrollLeft;
      
          let target;
      
          if (direction === 1) {
            target = positions.find(pos => pos > current + 2);
          } else {
            target = [...positions].reverse().find(pos => pos < current - 2);
          }
      
          if (target === undefined) return;
      
          isAnimating = true;
      
          const start = current;
          const distance = target - start;
          const startTime = performance.now();
      
          function animate(now) {
            const progress = Math.min((now - startTime) / duration, 1);
      
            // Smooth acceleration and deceleration
            const eased = 0.5 - Math.cos(Math.PI * progress) / 2;
      
            reel.scrollLeft = start + distance * eased;
      
            if (progress < 1) {
              animationId = requestAnimationFrame(animate);
            } else {
              animationId = null;
      
              // Instantly reposition to the matching original photo.
              // Because the images are identical, the reset is invisible.
              const cycleWidth = getCycleWidth();
              const firstOriginal = positions[originals.length];
              const firstAfter = positions[originals.length * 2];
      
              if (reel.scrollLeft >= firstAfter - 2) {
                reel.scrollLeft -= cycleWidth;
              } else if (reel.scrollLeft < firstOriginal - 2) {
                reel.scrollLeft += cycleWidth;
              }
      
              isAnimating = false;
            }
          }
      
          animationId = requestAnimationFrame(animate);
        }
      
        prev.addEventListener('click', () => moveReel(-1));
        next.addEventListener('click', () => moveReel(1));
      
        // Wait for the images to load before positioning the reel.
        Promise.all(
          originals.map(img =>
            img.complete
              ? Promise.resolve()
              : new Promise(resolve => {
                  img.addEventListener('load', resolve, { once: true });
                  img.addEventListener('error', resolve, { once: true });
                })
          )
        ).then(initialize);
      });
    </script>
