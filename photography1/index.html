<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lancelot&family=Trochut:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <a href="/about/">
            <img src="/icons/Annette Murray Logo.svg" alt="Annette Murray Logo" />
          </a>
        </div>

        <nav>
          <ul>
            <li><a href="/filmography/">filmography</a></li>
            <li><a href="/photography/">photography</a></li>
            <!--<li><a href="/resume/">resume</a></li>-->
            <li><a href="/contact/">contact</a></li>
          </ul>
        </nav>

        <div class="social-links">
          <a href="https://www.linkedin.com/in/annettecmurray" target="_blank" rel="noopener">
            <img src="/icons/linked in button.svg" alt="LinkedIn" />
          </a>
          <a href="https://instagram.com/annette.folio" target="_blank" rel="noopener">
            <img src="/icons/insta button.svg" alt="Instagram" />
          </a>
          <a href="https://www.youtube.com/@annettecmurray" target="_blank" rel="noopener">
            <img src="/icons/youtube button.svg" alt="YouTube" />
          </a>
          <a href="https://www.imdb.com/name/nm17785613/?ref_=ext_shr_lnkm" target="_blank" rel="noopener">
            <img src="/icons/imdb button.svg" alt="IMDb" />
          </a>
        </div>

         <div class="sidebar-footer">
          © 2026 Annette C. Murray
        </div>
      </aside>

      <main>
        <div class="mobile-header">
          <button class="hamburger" id="menuBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
          <div class="page-topline">digital & 35mm photography</div>
        </div>

        <img class="decor-top-right" src="/icons/frameright.svg" alt="" />
        <img class="decor-bottom-left" src="/icons/frameleft.svg" alt="" />

        <div class="photography-page">

      <div class="photo-category-nav">
        <a href="#portraits">portraits & events</a>
        <a href="#bts">behind the scenes</a>
        <a href="#personal">personal</a>
      </div>
    
      <!-- PORTRAITS & EVENTS -->
      <section class="photo-section" id="portraits">
        <h2>portraits & events</h2>
    
        <div class="photo-reel">
          <img src="/photos/portraits/photo1.jpg" alt="Portraits and events photograph 1">
          <img src="/photos/portraits/photo2.jpg" alt="Portraits and events photograph 2">
          <img src="/photos/portraits/photo3.jpg" alt="Portraits and events photograph 3">
        </div>
    
        <div class="photo-arrows">
          <button type="button" class="photo-prev" aria-label="Previous portrait photograph">←</button>
          <button type="button" class="photo-next" aria-label="Next portrait photograph">→</button>
        </div>
      </section>
    
      <!-- BEHIND THE SCENES -->
      <section class="photo-section" id="bts">
        <h2>behind the scenes</h2>
    
        <div class="photo-reel">
          <img src="/photos/bts/photo1.jpg" alt="Behind the scenes photograph 1">
          <img src="/photos/bts/photo2.jpg" alt="Behind the scenes photograph 2">
          <img src="/photos/bts/photo3.jpg" alt="Behind the scenes photograph 3">
        </div>
    
        <div class="photo-arrows">
          <button type="button" class="photo-prev" aria-label="Previous behind the scenes photograph">←</button>
          <button type="button" class="photo-next" aria-label="Next behind the scenes photograph">→</button>
        </div>
      </section>
    
      <!-- PERSONAL -->
      <section class="photo-section" id="personal">
        <h2>personal</h2>
    
        <div class="photo-reel">
          <img src="/photos/personal/photo1.jpg" alt="Personal photograph 1">
          <img src="/photos/personal/photo2.jpg" alt="Personal photograph 2">
          <img src="/photos/personal/photo3.jpg" alt="Personal photograph 3">
        </div>
    
        <div class="photo-arrows">
          <button type="button" class="photo-prev" aria-label="Previous personal photograph">←</button>
          <button type="button" class="photo-next" aria-label="Next personal photograph">→</button>
        </div>
      </section>
    
    </div>

        <div class="bottom-centered">
          <img src="/icons/email.svg" alt="" />
        </div>
      </main>
    </div>

    <script>
      const btn = document.getElementById('menuBtn');
      const sidebar = document.getElementById('sidebar');

      if (btn && sidebar) {
        btn.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          btn.classList.toggle('is-open');
        });
      }
    </script>
  </body>
</html>
