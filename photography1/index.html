        <div class="bottom-centered">

    <script>
      const btn = document.getElementById('menuBtn');
      const sidebar = document.getElementById('sidebar');

      if (btn && sidebar) {
        btn.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          btn.classList.toggle('is-open');
        });
      }

      // Photography reel arrows
        document.querySelectorAll('.photo-section').forEach(section => {
        const reel = section.querySelector('.photo-reel');
        const prev = section.querySelector('.photo-prev');
        const next = section.querySelector('.photo-next');
      
        let animationId = null;
      
        function moveReel(direction) {
          const images = Array.from(reel.querySelectorAll('img'));
          if (images.length < 2) return;
      
          // Stop any previous animation
          if (animationId !== null) {
            cancelAnimationFrame(animationId);
          }
      
          const maxScroll = reel.scrollWidth - reel.clientWidth;
          const current = reel.scrollLeft;
          const positions = images.map(img =>
            Math.min(img.offsetLeft - reel.offsetLeft, maxScroll)
          );
      
          let target;
      
          if (direction === 1) {
            target = positions.find(pos => pos > current + 5);
      
            // Last photo -> first photo
            if (target === undefined) target = 0;
          } else {
            target = [...positions].reverse().find(pos => pos < current - 5);
      
            // First photo -> last photo
            if (target === undefined) target = maxScroll;
          }
      
          const start = reel.scrollLeft;
          const distance = target - start;
          const duration = 1200;
          const startTime = performance.now();
      
          function animateScroll(now) {
            const progress = Math.min((now - startTime) / duration, 1);
      
            // Smooth ease-in-out animation
            const eased = 0.5 - Math.cos(Math.PI * progress) / 2;
      
            reel.scrollLeft = start + distance * eased;
      
            if (progress < 1) {
              animationId = requestAnimationFrame(animateScroll);
            } else {
              animationId = null;
            }
          }
      
          animationId = requestAnimationFrame(animateScroll);
        }
      
        prev.addEventListener('click', () => moveReel(-1));
        next.addEventListener('click', () => moveReel(1));
      });
    </script>
  </body>
</html>
